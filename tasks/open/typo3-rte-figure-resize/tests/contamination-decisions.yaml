# Recorded human decisions on contamination-check hits for this case.
#
# Every entry is a hit that scripts/contamination-check reported and a human
# judged a learning by the test in docs/contamination.md: the text helps an
# agent on a repository it has never seen. An entry is pinned to the skill ref
# it was judged at — bumping the skill in a fleet lapses the decision, and the
# new version's text is judged fresh.
#
# There are twenty-one of them, which is the most of any case here and is worth
# reading as a fact about the target rather than about the skills. This
# extension is the skill fleet's worked example: its name appears in 47 files
# across the installed skills, against 0 to 17 for every other target this
# benchmark uses. Six reference files account for all twenty-one hits, and each
# uses the extension to show a tooling shape — an XLIFF header, a runTests
# configuration, a docs URL, an RST directive, a JavaScript test layout.
#
# None of them touches rendering, figures, resizing or the reported defect. But
# the exposure is real and is stated in this case's README: an equipped arm
# carries documentation that names this repository far more often than it names
# any other target, and a win for that arm cannot be read as skill quality
# without weighing it.


