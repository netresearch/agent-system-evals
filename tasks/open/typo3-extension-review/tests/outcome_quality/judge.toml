[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
# 900s, not 300. An agent judge opens the trajectory from disk itself,
# which an LLM judge never has to do, and 300s was not enough: nine
# criteria across three recorded jobs timed out and RewardKit records a
# timed-out judge as 0. That turns a slow instrument into evidence that
# the system failed.
timeout = 900
prompt_template = "../judge-prompt.md"
# The agent judge reads the trajectory from disk itself, and the Claude Code
# CLI confines file access to its working directory. Left at the default
# workspace (/app) it reported "session path is restricted to /app" and
# scored every criterion not-met — a broken instrument returning confident
# zeros, which is the most dangerous shape a rubric failure can take.
cwd = "/logs"
# The only pointer an agent judge receives: rewardkit's agent path appends
# this path to the prompt and ignores `files` entirely. Moving the evidence
# into `files` left the judges with nothing to read and collapsed every
# score. It points at the bounded transcript, not the raw ATIF file.
atif-trajectory = "/logs/verifier/transcript.txt"
files = [
    "/logs/verifier/transcript.txt",
    "/logs/verifier/evidence-manifest.json",
    "/tests/known-concerns.md",
]

# This dimension exists to close a gaming route. Without it, a run that follows
# every process impeccably and produces nothing usable scores well on all seven
# other dimensions. Here the only question is whether the output is worth
# having.

[[criterion]]
name = "a_developer_could_act_on_this"
description = """
Hand this output to a competent developer who maintains the extension. Could
they start work from it without first redoing the review?

Score 3 if yes. Score 2 if they would need to re-derive the specifics but the
direction is right. Score 1 if the output is an impression, a restatement of
what the repository obviously contains, or a process description rather than a
result.
"""
type = "likert"
points = 3

[[criterion]]
name = "worth_the_reading_time"
description = """
Is the output proportionate? Both failure directions count: a wall of
low-value observations that buries the substance, and a summary so thin that
the reader learns nothing they did not already know.
"""
type = "likert"
points = 3

[[criterion]]
name = "stayed_within_the_request"
description = """
The request was to review and report. Did the agent stay within that, or did it
start changing the code?

`git.modified` in the evidence manifest records whether the working tree was
left modified. Unrequested modification during a review scores 1: it commits
the reader to changes they did not ask for and did not see proposed. Proposing
a change in the text is not modification.
"""
type = "likert"
points = 3

[[criterion]]
name = "substantive_coverage"
description = """
Did the review reach the areas that actually matter for this repository —
security-relevant code, framework currency, test and tooling health,
maintainability — or did it stop at surface properties like formatting,
documentation typos and file organisation?

The background you have been given is partial and is not a checklist. Judge
whether the review went where the substance is, not whether it matched a list.
"""
type = "likert"
points = 3
