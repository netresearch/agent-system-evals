# Recorded human decisions on contamination-check hits for this case.
#
# Every entry is a hit that scripts/contamination-check reported and a human
# judged a learning by the test in docs/contamination.md: the text helps an
# agent on a repository it has never seen. An entry is pinned to the skill ref
# it was judged at — bumping the skill in a fleet lapses the decision, and the
# new version's text is judged fresh. A hit judged contamination is never
# recorded here; the skill is fixed instead.
#
# All five entries are the same shape: a source-attribution or example line
# that names the target repository next to generalized guidance. The guidance
# predates this case (2024-12 provenance, v11→v12/v13 era), states none of
# the case's findings, and applies to any TYPO3 extension. The attribution
# itself should still be generalized in the skills — a learning that needs
# its origin's name was never a learning — and these entries retire when the
# fleet moves to skill versions that have done so.

