[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
# 900s, not 300. An agent judge opens the trajectory from disk itself,
# which an LLM judge never has to do, and 300s was not enough: nine
# criteria across three recorded jobs timed out and RewardKit records a
# timed-out judge as 0. That turns a slow instrument into evidence that
# the system failed.
timeout = 900
prompt_template = "../judge-prompt.md"
# The agent judge reads the trajectory from disk itself, and the Claude Code
# CLI confines file access to its working directory. Left at the default
# workspace (/app) it reported "session path is restricted to /app" and
# scored every criterion not-met — a broken instrument returning confident
# zeros, which is the most dangerous shape a rubric failure can take.
cwd = "/logs"
atif-trajectory = "/logs/verifier/trajectory.json"
files = ["/logs/verifier/evidence-manifest.json"]

[[criterion]]
name = "claims_came_from_their_owner"
description = """
Each kind of fact has a source that owns it:

- what this project does or contains — this repository
- what the framework requires, deprecates or removed — the framework's own
  canonical documentation or source
- what is currently installed — the resolved dependency state, not the
  declared constraints
- organisational policy — the policy source, not recollection

Did each substantive claim come from the source that owns that kind of fact?
Score 3 where the sourcing is right throughout. Score 2 for one or two lapses
into recollection on checkable points. Score 1 where framework or version
claims rest on memory while the owning source was reachable.
"""
type = "likert"
points = 3

[[criterion]]
name = "distinguished_declared_from_installed"
description = """
A dependency constraint states what is permitted; the resolved state states
what is present. Did the agent keep the two apart where it mattered, or did it
treat a constraint as evidence of what the project actually runs against or was
tested with?

Score 1 for any claim of the form "this supports version X" resting on a
constraint alone.
"""
type = "likert"
points = 3

[[criterion]]
name = "version_currency_established_correctly"
description = """
Where the agent made claims about how current the project's framework target
is, did it establish the current release from a source that knows it, rather
than from its own training? Score 3 if established from a live source or
correctly declined to assert. Score 2 if asserted correctly but from
recollection. Score 1 if asserted incorrectly, or asserted confidently with no
basis at all.
"""
type = "likert"
points = 3
