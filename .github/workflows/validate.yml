# Deterministic checks only. No agent runs, no judge calls.
#
# An agent trial costs money and takes an hour, and a single trial is not
# evidence anyway (docs/open-forward-review.md section 7). Gating pull requests
# on one would be expensive and would teach people to distrust the result. What
# is gated here is everything that can be decided without spending anything.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a full commit SHA. Netresearch-owned
      # reusable workflows stay on @main so upstream fixes propagate.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Verifier library is in sync across cases
        run: ./scripts/sync-verifier-lib --check

      # README shipped a ./scripts/bootstrap that had never been written.
      # Nothing catches that except the reader, who then distrusts the page.
      - name: Documentation names only things that exist
        run: ./scripts/validate-docs

      - name: Verifier self-test
        run: uv run --with pytest python -m pytest verifier/tests -q

      - name: Rubric loads and follows repository rules
        run: ./scripts/validate-rubric

      - name: Verifier discriminates between recorded runs
        run: ./scripts/verifier-selftest

      # Uses Harbor's own validator. Harbor itself reports an invalid task as
      # "0 tasks available in this dataset", which names neither the case nor
      # the field; this surfaces the actual error.
      - name: Cases are valid tasks and follow repository rules
        run: ./scripts/validate-tasks

      # Calls no judge: it reads the recorded calibration and checks it still
      # describes this rubric. A missing calibration is reported as a gap and
      # does not fail the build — a gate that reddens main until someone spends
      # judge calls is a gate people route around.
      - name: Judge calibration is current
        run: ./scripts/check-calibration

      # Was a bare executability check that fed the metric `skill_routing` —
      # the name the dimension had stopped having — and asserted nothing about
      # the output. It passed for weeks while the metric aggregated a dimension
      # no case emits, ignored the one every case does, and scored missing
      # dimensions as zero against its own docstring.
      # Advisory by design: it names the files and the part to bump rather
      # than blocking, because a gate that fires on documentation edits gets
      # disabled within a week. `continue-on-error` keeps the annotation
      # visible without reddening a pull request that only moved prose.
      - name: Version moves when a score can
        continue-on-error: true
        run: ./scripts/benchmark-version --check --against origin/main

      # The page is rendered from recorded jobs, which are not on this runner.
      # What is checkable without them: every placeholder names a field the
      # generator can resolve, and the committed page has none left in it.
      - name: Published page is generated, not typed
        run: ./scripts/build-site --lint

      - name: Analysis core behaves as specified
        run: uv run --with pytest --with pyyaml python -m pytest tests -q

      # Version-pinned and checksummed. `apt-get install shellcheck` installs
      # whatever the runner image carries, which was not the version anyone had
      # locally: SC2015 fires in 0.10 and not in 0.11, so `capability-probe.sh`
      # was green on every developer machine and red in CI for days without
      # anything in the repository changing. An unpinned linter fails on the
      # calendar rather than on the diff.
      - name: Shell scripts lint clean
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
          shellcheck --severity=style \
            scripts/bootstrap scripts/sync-verifier-lib \
            scripts/verifier-selftest scripts/run-smoke \
            scripts/refresh-target-lock scripts/regrade scripts/sync-environment \
            scripts/prepare-companion scripts/agent-surface-audit \
            tasks/*/*/environment/*.sh tasks/*/*/tests/test.sh

  contamination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      # Separate job: this one reaches the network to fetch each pinned skill,
      # so it fails for reasons unrelated to the change under review. Keeping
      # it apart makes that distinguishable at a glance.
      #
      # The declared markers are the identifiers that give a case's findings
      # away, so they live inside the encrypted expectations and this job needs
      # the key to read them. Without the secret the run still happens and
      # checks the generic markers, and says on stderr that it covered less —
      # a quiet fall back to a narrower question is how a check keeps passing
      # while measuring nothing.
      - name: Fleet carries no case-specific knowledge
        env:
          EVALS_EXPECTATIONS_KEY: ${{ secrets.EVALS_EXPECTATIONS_KEY }}
        run: ./scripts/contamination-check --fleet nr

      - name: Expectations are encrypted and complete
        run: ./scripts/expectations check
