# The stack with a proposed change, derived from `nr` rather than copied.
#
# A copy still names the parent's other versions on the day the parent moves,
# so the arm measures two changes and reports one. `at` moves exactly the refs
# named here and inherits the rest; pinning one to what the parent already
# carries is refused, because that arm equals its parent and reads as a change
# with no effect.
#
# A branch ref is acceptable here and only here, a candidate being transient by
# definition — and it must not be touched while a comparison is using it.
# Pushing to it mid-run gives one arm two treatments; merging and deleting it
# leaves the next trial with nothing to resolve. Both happened on 31 August,
# an hour apart. Record the resolved commit from the job lock with the result — a
# branch that moves between the two runs of an A/B invalidates the comparison,
# and the lock is the only thing that will show it.

name: candidate
description: nr with the upgrade skill searching Tests/ as well as Classes/ — the fix for the one line four resolving trials died on

derives_from: nr
at:
  # An experiment branch, not a release, and the one variable under study.
  #
  # Three cases ask what an extension declares about the TYPO3 versions it
  # supports, and this skill — in the fleet throughout — was invoked in 0 of 16
  # trials. The same skill is invoked 3 of 3 when the request says "review this
  # extension". Its description names TER readiness, conformance and quality,
  # and no artefact those three cases are about.
  #
  # The branch adds three phrases to the trigger list and removes nothing, so
  # the arm differs from `nr` in exactly one direction. It is nine words over
  # the skill repository's word cap for that reason, and is not releasable as
  # it stands; see netresearch/typo3-conformance-skill#115.
  #
  # Resolved commit at the time of writing: 55b0c46. The lock records what each
  # trial actually got, and a branch that moves mid-series is why that matters.
  #
  # ROUND ONE, answered 28 August 2026: appending the artefacts to the
  # "Also triggers on:" tail does nothing. Twelve trials, `skill_invoked` 0/6
  # on `nr` against 1/6, Fisher p 1.000. Recorded in
  # tasks/open/typo3-version-metadata-consistent/RESULTS.md.
  #
  # ROUND TWO, ANSWERED 28 August 2026: position rather than vocabulary, and
  # it is position. `skill_invoked` 0/6 on `nr` against 6/6 here, Fisher exact
  # p 0.002 — the same words as round one, moved thirty-five words earlier,
  # take this case from never routing to always routing. Recorded in
  # tasks/open/typo3-version-metadata-consistent/RESULTS.md. The arm may be
  # repointed at the next question; this one is closed. The comparison that
  # did work the same day was github-release-skill — invoked 6/6 on "prepare
  # the 2.4.2 release", p 0.002 — whose description names the request's noun in
  # its opening "Use when" clause rather than in a list thirty-five words later.
  # This branch moves the same two artefacts to the front and changes nothing
  # else. Unlike round one it passes the skill repository's own validator, so a
  # positive result is releasable as it stands. Resolved commit: 6174033.
  # ROUND FOUR, open: can a reference fix carry the small model over a case it
  # fails outright? This is the arm's first use for something other than a
  # description.
  #
  # On OFR-TYPO3-UPGRADE-001, Haiku 4.5 reads 0/6 in both arms. The two arms do
  # not fail alike, and the difference is already the skills' doing: the bare
  # agent never resolves v14 at all, 0 of 6, while the equipped agent resolves
  # v14.3.6 in 4 of 6 and then loses every one of those four to the same line --
  #
  #   Class "TYPO3\CMS\Frontend\Controller\TypoScriptFrontendController"
  #   not found, Tests/Unit/Classes/Context/AbstractContextTest.php:38
  #
  # -- a class removed in v14, named in the skill's own v13-to-v14 table, whose
  # prescribed search looks only in Classes/. PHPUnit resolves it while loading
  # the suite, so the run dies before a test executes.
  #
  # The branch widens fifty searches to Classes/ and Tests/ and says why
  # (netresearch/typo3-extension-upgrade-skill#56). If the fix works, the small
  # model passes a case it has never passed, which is the point of the whole
  # exercise rather than a detail of it.
  # Pointed at `main` rather than the branch: the branch merged and was deleted
  # mid-run, and Harbor resolves a ref per trial, so the next one had nothing to
  # resolve. Two runs were lost to the same class of mistake in one afternoon --
  # the first because a push moved the branch under a running comparison, the
  # second because a merge removed it. The header above says a branch ref is
  # acceptable for this arm and only this arm; it does not say a branch may be
  # touched while the arm is in use, and now it does.
  netresearch/typo3-extension-upgrade-skill: main

  # ROUND THREE, ANSWERED 31 August 2026: the released wording routes too.
  # Haiku 0/6 against 6/6, Fisher exact p 0.002, on the decontaminated commit
  # 88df0ce, confirmed in all six candidate locks.
  #
  # It took three runs, and the first two are superseded rather than averaged
  # in. Pointing this arm at `main` put the skill's new evals/eval_queries.json
  # into the fleet, and that file carried this benchmark's case instructions
  # verbatim, its case identifiers and its measured routing rates -- including
  # the rate for this case. contamination-check raised nineteen hits the first
  # time the fleet resolved, which is what it is for. Routing is decided from
  # descriptions before any file inside a skill is read, so the endpoint could
  # not have moved; that argument is correct and was not accepted, because a
  # benchmark that talks past its own gate has none. The file was rewritten at
  # the source (typo3-conformance-skill#120) and the comparison re-run.
  #
  # For the record, the contaminated arm scored lower, 5/6: carrying the
  # benchmark's own prompts bought the skill nothing. The Opus 5 run at
  # 310dc33, made by accident when --model was omitted, also read 6/6 at
  # p 0.002, so the mechanism is not a property of the small model either.
  #
  # Recorded in tasks/open/typo3-version-metadata-consistent/RESULTS.md. The
  # arm may be repointed; this question is closed.
  #
  # The question it answered: does the released wording route, or only the
  # experiment branch's? Round two's branch was nine words over the skill
  # repository's cap and never shippable. What merged instead
  # (netresearch/typo3-conformance-skill#119) is a rewrite, not that branch:
  # it opens with the same three artefacts but says them in fewer words, drops
  # the "Also triggers on:" label entirely, and lands at 358 characters. A
  # positive round two does not transfer to different words in the same
  # position, so the shipped description is measured on its own.
  #
  # Pointed at `main`, not at a tag, because no release carries the change yet:
  # v2.19.2 predates it and holds the old description. Resolved commit at the
  # time of writing: 310dc33. Confound, stated rather than removed: `nr` pins
  # v2.19.1, so this arm also carries two documentation commits and a
  # checkpoints fix. Neither touches the description, which is the only text
  # routing reads, but both are in the arm and could move a graded dimension.
  #   (closed; the conformance description shipped and the arm was repointed)
