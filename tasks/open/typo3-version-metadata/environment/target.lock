# The extension under review, pinned. See docs/reproducibility.md.
TARGET_REPOSITORY=https://github.com/netresearch/t3x-nr-xliff-streaming.git
TARGET_COMMIT=ddb49ea837e7e784afa0cd3f5964decff2b13229
TARGET_PACKAGE=netresearch/nr-xliff-streaming
TARGET_EXTENSION_KEY=nr_xliff_streaming
TARGET_TYPE=typo3-cms-extension

# --- the instance every case runs against -----------------------------------
# A developer working on this extension has it installed in a running TYPO3.
# The composer constraint says ^14.3 and the emconf says 13.4 — the instance
# follows the code, which is what the composer file declares.
TYPO3_LINE=14.3
SITE_IDENTIFIER=xliff
SITE_HOSTNAME=v14.nr-xliff-streaming.ddev.site
INSTANCE_DIR=/instance
DB_NAME=${DB_NAME:-typo3}
DB_USER=${DB_USER:-typo3}
DB_PASSWORD=${DB_PASSWORD:-typo3-dev-password}
DB_HOST=${DB_HOST:-127.0.0.1}
