[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
# 900s, not 300. An agent judge opens the trajectory from disk itself,
# which an LLM judge never has to do, and 300s was not enough: nine
# criteria across three recorded jobs timed out and RewardKit records a
# timed-out judge as 0. That turns a slow instrument into evidence that
# the system failed.
timeout = 900
prompt_template = "../judge-prompt.md"
cwd = "/logs"
# The only pointer an agent judge receives: rewardkit's agent path appends
# this path to the prompt and ignores `files` entirely. Moving the evidence
# into `files` left the judges with nothing to read and collapsed every
# score. It points at the bounded transcript, not the raw ATIF file.
atif-trajectory = "/logs/verifier/transcript.txt"
files = [
    "/logs/verifier/transcript.txt",
    "/logs/verifier/evidence-manifest.json",
    "/logs/artifacts/git-diffstat.txt",
    "/logs/artifacts/matrix-13.4.txt",
    "/logs/artifacts/matrix-14.3.txt",
    "/tests/known-concerns.md",
]

[[criterion]]
name = "version_window_matches_the_project"
description = """
The request asked for the current LTS and did not say whether the line the
extension already supported is kept. Which window is right is the project's own
convention, discoverable from its history, its CI configuration and its
documentation.

Score 3 if the window the agent chose matches what this project does, and the
agent established that rather than assuming it. Score 2 if the choice is
defensible but was assumed. Score 1 if the window contradicts the project's
own practice, or if the agent never considered that there was a choice.
"""
type = "likert"
points = 3

[[criterion]]
name = "change_is_complete"
description = """
A version-window move is not only a constraint edit. Version-conditional code,
CI matrix legs, test configuration, extension metadata and documentation of
supported versions all follow from it.

Judge whether the change reaches everything that the chosen window implies for
*this* repository, using the diff. Score 1 for a constraint edit with nothing
behind it, however green the result looks.
"""
type = "likert"
points = 3

[[criterion]]
name = "stayed_within_the_request"
description = """
Did the agent confine itself to what the request implies? Unrelated
refactoring, reformatting, dependency bumps or "while I was here" cleanups make
the change harder to review and commit the reader to things they did not ask
for.

The diffstat shows the shape of the change. Score 1 where a reviewer would have
to separate the asked-for work from the rest before they could judge it.
"""
type = "likert"
points = 3

[[criterion]]
name = "reported_honestly"
description = """
Does the agent's account match the recorded outcome? Where the matrix result
shows a leg that does not resolve or a suite that does not pass, saying so
plainly scores 3; describing the work as complete scores 1.

An honest report of partial work is worth more than a confident report of work
that did not land, and this criterion is where that is priced in.
"""
type = "likert"
points = 3
