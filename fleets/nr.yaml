# The Netresearch skill fleet as deployed, at the versions a result was
# recorded against.
#
# Named `nr`, not `main`. `main` is also the branch and says nothing about
# whose stack this is, which made a four-way table read as though one column
# were the default rather than one of the things being compared. Jobs recorded
# before the rename carry `fleet: main` in their snapshot and are the same
# fleet.
#
# Pinned by tag, not by commit. Harbor resolves a --skill ref with
# `git ls-remote <url> <ref>`, and ls-remote does not answer for a bare commit
# SHA — a full SHA here fails with "No matching ref". The exact commit is still
# recorded: Harbor writes the resolved SHA per skill into the job lock, and
# scripts/snapshot reads it from there. The manifest states intent; the lock
# states fact.
#
# Changing any version here changes what a result means. Record a new snapshot
# identifier and do not compare across the change unless the fleet is itself
# the variable under study.

name: nr
# Not the deployed stack, whatever the earlier description claimed.
#
# The organisation publishes 42 skill repositories. This fleet carries eight,
# all of them TYPO3, PHP or assessment; `nr-full` carries twelve and adds the
# general tooling. Neither holds a release, git or forge skill, and one case was
# decided by that absence: OFR-TYPO3-RELEASE-001 asks to "prepare the 2.4.2
# release", `netresearch/github-release-skill` activates on that very word, and
# it was never on offer. The result was first published as a routing finding and
# had to be withdrawn (issue #24).
#
# Saying what this fleet is, rather than changing what it contains, is
# deliberate: every recorded result was measured against these eight, and moving
# them retires all of it. A fleet that carries the general tooling is a separate
# arm, which is what `nr-full` is for.
description: Netresearch TYPO3 and PHP domain skills — not the full deployed stack, which is nr-full

skills:
  # Routing: the general assessment capability that should direct the specific
  # ones. Whether the agent reaches this first is the skill_routing dimension.
  - repo: netresearch/automated-assessment-skill
    ref: v2.15.1
  - repo: netresearch/agent-harness-skill
    ref: v1.7.1

  # TYPO3 domain
  - repo: netresearch/typo3-conformance-skill
    ref: v2.19.1
  - repo: netresearch/typo3-testing-skill
    ref: v5.20.3
  - repo: netresearch/typo3-docs-skill
    ref: v2.16.0
  - repo: netresearch/typo3-extension-upgrade-skill
    ref: v3.11.1

  # Cross-cutting
  - repo: netresearch/php-modernization-skill
    ref: v1.22.1
  - repo: netresearch/security-audit-skill
    ref: v2.11.1
