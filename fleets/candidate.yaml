# The stack with a proposed change. Differs from main in as few entries as
# possible — ideally one, so a difference in results has one candidate cause.
#
# A branch ref is acceptable here and only here, because a candidate is
# transient by definition. Record the resolved commit from the job lock with
# the result; a branch that moves between the two runs of an A/B invalidates
# the comparison, and the lock is the only thing that will show it.

