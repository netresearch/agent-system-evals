name: dev-mcp
description: balatD/typo3-dev-mcp only — its MCP server against the running instance

# No skills. This tool has none: it is a TYPO3 extension that exposes the
# running installation over MCP — TCA, database schema, sites, TypoScript,
# logs, the core changelog — and that is its whole delivery mechanism.
skills: []

# The server is a console command of the instance under test, so it lives in
# the environment image like the companion's does, and only this config varies
# per fleet. `scripts/validate-tasks` requires every runtime case to install
# the package at the pin below.
#
# Every case now runs against an installed, served instance, so the old
# `requires: runtime` no longer excludes anything. What does exclude something
# is the package's own constraint: it requires typo3/cms-core ^13.4 || ^14.0.
# A target that supports only v12.4 gets a v12.4 instance — that is the
# instance its developer has — and this server cannot be installed there.
#
# Stated as a version floor rather than left to fail at build time, so a case
# on an older line reports "not applicable" instead of an image that does not
# build.
min_typo3_line: "13.4"

package: balatd/typo3-dev-mcp:v0.1.0-alpha.8

# Installed into the instance when this arm runs, not baked into the image for
# every arm. The image used to carry it for all of them — installed *and*
# activated — with only the MCP registration varying, so the control instance
# listed an extra dev extension and loaded its services too. That is not a
# control.
env:
  PROVISION_PACKAGES: "balatd/typo3-dev-mcp:v0.1.0-alpha.8"

mcp:
  name: typo3-dev-mcp
  command: /instance/vendor/bin/typo3
  args: ["devmcp:serve"]

# Stated asymmetry, because it understates this arm rather than flattering it:
# the vendor's own setup (`typo3 devmcp:install`) registers the server *and*
# writes a guidelines file into the project, linked from CLAUDE.md, which is
# then always-on context. This arm installs only the server.
#
# The reason is mechanical: Harbor's per-fleet channel is skill injection, and
# a guideline is not a skill — wrapping it as one would change it from context
# the agent always has into a document it must decide to open, which is a
# different intervention wearing the same name. Measuring the guidelines
# variant needs a second arm, not a silent substitution here.
