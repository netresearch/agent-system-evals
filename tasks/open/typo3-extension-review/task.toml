schema_version = "1.4"

# Collected for grading now and for regrade later. A regrade sees only what was
# kept, so this list is reviewed as part of the case, not as an afterthought.
# See docs/reproducibility.md.
#
# This must stay above the first table header. `artifacts` is a top-level key,
# and TOML assigns any key written after `[environment]` to that table instead
# — where it parses to an empty list in silence, and the trajectory never
# reaches the verifier.
artifacts = [
    "/logs/artifacts",
    # The agent's trajectory. A separate verifier sees only /tests,
    # /logs/verifier and the collected artifacts — the agent's log directory is
    # not mounted into it. Without this entry the trajectory is unreachable
    # from the verifier, and every judge criterion in this rubric grades
    # observable behaviour it could not observe.
    "/logs/agent",
    "/app/composer.json",
]

[task]
name = "netresearch/ofr-typo3-extension-review"
version = "1.0.0"
description = "Open forward review of a real TYPO3 extension at a pinned historical commit"
authors = [{ name = "Netresearch DTT GmbH" }]
keywords = ["open-forward-review", "typo3", "agent-system"]

[metadata]
case_id = "OFR-TYPO3-EXT-001"
category = "open-forward-review"
domain = "typo3"
target_type = "extension"
target_repository = "https://github.com/netresearch/t3x-sync.git"
target_package = "netresearch/nr-sync"
target_sha = "bac18b776ba459e9d90c1e09e1a38fa4507c3734"
# Repository-level only. This case makes no claim about runtime behaviour;
# see docs/adr/0006-runtime-fidelity.md.
# Every case runs against an installed, served instance — that is what a
# developer has. See environment/common/README.md.
runtime = true
source_learning_id = "retro-20260815-assessment-routing"

[agent]
timeout_sec = 3600.0

# The agent may consult canonical upstream sources — the authority dimension
# is meaningless without that — but must not reach the target's own forge.
# Ground truth for this case lives in the target's future commits, and a public
# network mode would turn an open review into a lookup.
# See docs/open-forward-review.md section 3.
network_mode = "allowlist"
allowed_hosts = [
    "api.anthropic.com",
    "docs.typo3.org",
    "api.typo3.org",
    "get.typo3.org",
    "typo3.org",
    "extensions.typo3.org",
    "packagist.org",
    "repo.packagist.org",
]


[environment.healthcheck]
# The agent must never start against a half-installed instance. Checked by
# consequence rather than status: a 200 on /typo3/ is reachable with every
# sub-route broken, so the login route is what gets asked.
command = "test -f /instance/.instance-ready && cd /instance && vendor/bin/typo3 site:list >/dev/null && curl -fsS -o /dev/null http://v12.nr-sync.ddev.site/typo3/login"
timeout_sec = 30.0
start_period_sec = 300.0
start_interval_sec = 10.0
retries = 5

[environment.env]
DB_HOST = "127.0.0.1"
DB_NAME = "typo3"
DB_USER = "typo3"
DB_PASSWORD = "typo3-benchmark-password"

[verifier]
# Eight dimensions, judged at up to 900s each, two at a time: the worst case is
# four batches. 1800s did not cover it and the excess arrived as timed-out
# judges scored zero, which is indistinguishable from a system that failed.
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.env]
# Two credential paths, both declared because TOML cannot choose between them.
# scripts/run-evaluation requires one and passes the other as an empty string,
# which both RewardKit and the Claude Code CLI read as absent.
#
# The subscription path is the cheaper one and works for the judge as well as
# the agent: LiteLLM recognises an sk-ant-oat token and sends it as a bearer
# token, so a Pro/Max/Team subscription covers the whole trial.
#
# Nothing short or low-entropy may be declared here. Harbor treats every value
# in this table as a secret and removes that literal string from all captured
# output. A flag passed as "1" therefore replaced every digit 1 in every
# collected file: `python3.12` became `python3.[REDACTED]2`, and — fatally —
# `"step_id": 1` in the recorded trajectory became `"step_id": [REDACTED]`.
# That is not valid JSON, so the trajectory could no longer be parsed by the
# judges or by a regrade, and a completed agent trial was lost as evidence.
#
# REWARDKIT_FORCE_OAUTH sat here for exactly one run and caused precisely that.
# It is also unnecessary: run-evaluation passes one credential and blanks the
# other, so there is nothing to disambiguate. scripts/run-evaluation now
# refuses to start when a declared value is shorter than 12 characters.
# REWARDKIT_JUDGE is deliberately absent. It was here, holding "claude-code" —
# eleven characters, and the name of the agent — so Harbor would have stripped
# that string from every captured file and destroyed the trajectory wholesale.
# The guard caught it before the run. The judge belongs in the rubric anyway,
# where judge.toml pins it and the rubric digest records it; an environment
# override would make the recorded judge unknowable after the fact.
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN}"

[verifier.environment]
# No docker_image: the verifier image is built from tests/Dockerfile, with
# tests/ as its build context. That is how the rubric reaches the container at
# all — see the comment in tests/Dockerfile.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "pypi.org", "files.pythonhosted.org"]

# Snapshot the agent environment's final state into files the separate verifier
# can read. Without these the verifier sees no git evidence at all, because it
# runs in a fresh container.
# What the arm was actually given. Run after the agent phase because Harbor
# hands the MCP configuration to the agent process, not to the container — so
# this is the earliest point at which the servers can be asked to describe
# themselves. It records provisioning only; what the agent did with it is
# counted from the trajectory, separately, and the two must not be conflated:
# a server that never answered makes a run void, a server that answered and
# went unused is a result.
[[verifier.collect]]
command = "MCP_CONFIG=$(ls /logs/agent/*mcp*.json 2>/dev/null | head -1) /usr/local/bin/capability-probe /logs/artifacts/capability-inventory.json > /logs/artifacts/capability-probe.log 2>&1 || true"
timeout_sec = 180.0

[[verifier.collect]]
command = "git -C /app status --porcelain > /logs/artifacts/git-status.txt 2>&1 || true"

[[verifier.collect]]
command = "git -C /app diff HEAD > /logs/artifacts/git-diff.patch 2>&1 || true"

[[verifier.collect]]
command = "git -C /app rev-parse HEAD > /logs/artifacts/git-head.txt 2>&1 || true"

[[verifier.collect]]
command = "ls -la /app > /logs/artifacts/workspace-listing.txt 2>&1 || true"

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "public"
