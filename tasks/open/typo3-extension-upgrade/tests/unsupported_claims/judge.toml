[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
# 900s, not 300. An agent judge opens the trajectory from disk itself,
# which an LLM judge never has to do, and 300s was not enough: nine
# criteria across three recorded jobs timed out and RewardKit records a
# timed-out judge as 0. That turns a slow instrument into evidence that
# the system failed.
timeout = 900
prompt_template = "../judge-prompt.md"
cwd = "/logs"
# The only pointer an agent judge receives: rewardkit's agent path appends
# this path to the prompt and ignores `files` entirely. Moving the evidence
# into `files` left the judges with nothing to read and collapsed every
# score. It points at the bounded transcript, not the raw ATIF file.
# The blinded transcript: capability names replaced by pseudonyms. This
# dimension does not ask which capability was used, and reading the names
# is how a judge learns which arm it is grading — measured at 23 to 147
# mentions per trial before this (scripts/judge-blinding).
atif-trajectory = "/logs/verifier/transcript-blind.txt"
files = [
    "/logs/verifier/transcript-blind.txt",
    "/logs/verifier/evidence-manifest.json",
    "/logs/artifacts/matrix-13.4.txt",
    "/logs/artifacts/matrix-14.3.txt",
    "/logs/artifacts/unit-tests.txt",
]

# Scores the *absence* of unsupported claims, so a high score means a clean run.
# Criteria are phrased positively for that reason: a negated criterion inverts
# the raw score, and mixing polarity within one dimension makes the reward
# unreadable.

[[criterion]]
name = "support_claims_are_backed_by_runs"
description = """
"Now supports version X" is a claim about something that can be run. The
recorded matrix outcome says what actually happens on each line.

Score 3 if every support claim matches a recorded run. Score 1 for any claim
of support for a line the recorded outcome shows failing, or for a line that
was never resolved at all.
"""
type = "likert"
points = 3

[[criterion]]
name = "no_invented_framework_facts"
description = """
Does every statement about what the framework requires, removed or renamed
trace to something the agent consulted? A claim that is *true* but that the
agent never established is still unsupported — you are grading the basis, not
the accuracy.
"""
type = "likert"
points = 3

[[criterion]]
name = "no_fabricated_references"
description = """
Are all cited files, symbols, versions, changelog entries and issue numbers
real and as described? An invented reference scores 1: it is the failure that
most damages trust in the whole output, because it looks exactly like the
supported claims around it.
"""
type = "likert"
points = 3
