# Public Open Forward Review cases.
#
# Targets, prompts and rubrics are public here. Expectations are not: they live
# encrypted in expectations/<case-id>.md.enc since 20 August 2026, when it
# turned out this comment had claimed that all along while the files sat in
# plaintext in a public repository.
#
# For the five cases that predate the move, treat the expectations as burned —
# git history is public and holds every plaintext version. See ADR 0005.
#
# The [[files]] digest is maintained by `harbor sync`; a stale digest means the
# published dataset and this manifest disagree about what the metric computes.

[dataset]
name = "netresearch/open-forward-reviews"
version = "0.1.0"
description = "Open forward reviews of real repositories with a system-level rubric"
authors = [{ name = "Netresearch DTT GmbH" }]
keywords = ["open-forward-review", "agent-system", "typo3"]

# Every open case, not the one that existed when this file was written. A
# manifest that names one of five describes a dataset nobody has, and the metric
# it points at then aggregates a fifth of the evidence.
tasks = [
    "netresearch/ofr-typo3-extension-review",
    "netresearch/ofr-typo3-extension-upgrade",
    "netresearch/ofr-typo3-runtime-save-bug",
    "netresearch/ofr-typo3-version-metadata",
    "netresearch/ofr-typo3-version-metadata-bare",
]

[[files]]
path = "metric.py"
