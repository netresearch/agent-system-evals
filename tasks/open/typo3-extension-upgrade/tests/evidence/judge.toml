[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
# 900s, not 300. An agent judge opens the trajectory from disk itself,
# which an LLM judge never has to do, and 300s was not enough: nine
# criteria across three recorded jobs timed out and RewardKit records a
# timed-out judge as 0. That turns a slow instrument into evidence that
# the system failed.
timeout = 900
prompt_template = "../judge-prompt.md"
cwd = "/logs"
# The only pointer an agent judge receives: rewardkit's agent path appends
# this path to the prompt and ignores `files` entirely. Moving the evidence
# into `files` left the judges with nothing to read and collapsed every
# score. It points at the bounded transcript, not the raw ATIF file.
# The blinded transcript: capability names replaced by pseudonyms. This
# dimension does not ask which capability was used, and reading the names
# is how a judge learns which arm it is grading — measured at 23 to 147
# mentions per trial before this (scripts/judge-blinding).
atif-trajectory = "/logs/verifier/transcript-blind.txt"
files = [
    "/logs/verifier/transcript-blind.txt",
    "/logs/verifier/evidence-manifest.json",
    "/logs/artifacts/git-diff.patch",
]

[[criterion]]
name = "each_change_has_a_reason"
description = """
In a writing task the evidence is the diff. Can each substantive change be
traced to something the agent established — a documented removal, a failing
test, a resolver error — rather than to a general sense of what a newer version
wants?

Score 3 where the changes are accounted for. Score 2 where the main ones are.
Score 1 for a diff whose contents cannot be explained from anything the agent
observed.
"""
type = "likert"
points = 3

[[criterion]]
name = "compatibility_of_the_kept_line_considered"
description = """
Where the result is meant to serve more than one version line, each change has
to be safe on the older one too. A newer idiom applied unconditionally breaks
the line it was not written for.

Score 3 where the agent visibly reasoned about, or tested, the effect on the
older line. Score 1 where changes were applied as though only the newest
version existed.

If the agent deliberately targeted a single line and said so, judge that choice
under outcome quality instead and score this 3.
"""
type = "likert"
points = 3

[[criterion]]
name = "uncertainty_is_visible"
description = """
Where the agent was unsure — a change it could not verify here, an API it could
not confirm — did it say so and say why? Score 3 where confidence tracks the
evidence. Score 1 where a uniform tone covers claims of very different
evidential strength.
"""
type = "likert"
points = 3
