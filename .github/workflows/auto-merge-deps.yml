name: Auto-merge dependency PRs

on:
  # The reusable only calls `gh pr merge` with the base-repo token; it never
  # checks out or runs PR head code, so pull_request_target is safe here.
  #
  # paths-ignore does the gating, at the trigger. A dependency update inside a
  # case's environment is a change to the case, not maintenance: it moves what
  # the agent is measured on and demands a major VERSION bump
  # (docs/governance.md). renovate.json holds those on the dependency
  # dashboard, but approving one there produces an ordinary pull request, and
  # this keeps the workflow from merging it.
  #
  # A gate job was tried first and did not work: it read the file list, logged
  # "verdict: no — auto-merge may proceed", and the `uses:` job guarded by
  # `if: needs.<job>.outputs.verdict == 'no'` was skipped anyway, on pull
  # requests touching nothing but .github/. The verdict never reached the
  # condition. Rather than keep guessing at that, the filter moved to the
  # trigger, where GitHub evaluates it: a pull request that touches tasks/
  # starts no run at all.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    paths-ignore:
      - 'tasks/**'

permissions: {}

jobs:
  auto-merge:
    # @main on purpose: this is an organisation-owned reusable, and pinning it
    # to a hash would hold this repository on a fixed copy of a workflow whose
    # fixes are meant to reach every consumer. Third-party actions are pinned.
    uses: netresearch/.github/.github/workflows/auto-merge-deps.yml@main
    permissions:
      contents: write
      pull-requests: write
