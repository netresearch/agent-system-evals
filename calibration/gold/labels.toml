# The gold set: recorded runs, and what a human says they deserve.
#
# Four fixtures that already exist because the mechanical criteria are proved
# against them (`scripts/verifier-selftest`). They are reused here rather than
# invented, because a fixture nobody has ever graded by hand is not a label.
#
# `expect` is a band, not a point. Asking a judge to hit 0.83 is asking for
# precision it does not have; asking it to put a run that did nothing below 0.3
# and a thorough one above 0.7 is asking whether the criterion works at all. A
# judge that cannot separate these two has nothing to say about two fleets.
#
# **These bands are the author's judgement, not an independent human's.** Two
# raters who have not seen each other's answers is what the issue asks for, and
# this is one rater who also wrote the rubric. Read the report accordingly: it
# can establish that a judge is unrepeatable, and it cannot yet establish that a
# judge is right.

version = 1

# Whether the bands below were set by someone who did not write the rubric. They
# were not. Until they are, a judge that disagrees with a band is reported and
# does not fail the build: the alternative is adjusting the bands until the judge
# agrees with them, which is calibrating the ruler to the measurement.
# Repeatability — the spread across repeats — is measured against nobody's
# opinion and stays a hard gate.
[rater]
independent = false

[thresholds]
# The most a criterion may move across repeats on identical input before its
# scores stop supporting a finding. A dimension that answers 3, 1, 2 cannot
# carry a 2/3-against-3/3 difference — that difference is smaller than the
# instrument's own step.
# How far the median may sit outside the human band before the criterion is
# measuring something other than what it says.
max_deviation = 0.2

# The same question asked of a single criterion needs a different number, and
# the first calibration to report criteria showed why: 24 of 152 criterion
# measurements breached max_spread, and 21 of them by exactly 0.50.
#
# A three-point criterion maps to {0.0, 0.5, 1.0}, so 0.50 is one step — the
# smallest movement it can make. A threshold below the quantum does not
# separate "moves a little" from "moves a lot"; it fails everything that moves
# at all, and a gate that can only be passed by a criterion which never budges
# is a gate nobody can act on.
#
# The distinction that survives at this granularity is one step against the
# full range. A criterion answering 2 and 3 on identical input is imprecise; one
# answering 1 and 3 is not measuring anything stable. So: fail above one step,
# report at one step. Every mechanical criterion measured 0.00 across all 40 of
# its measurements, as a deterministic check should.
max_criterion_spread = 0.5

# What share of criterion measurements may exceed that, before the rubric as a
# whole is too noisy to carry findings.
#
# This is the criterion-level gate, and it is a share rather than a list
# because a list does not reproduce. Two calibrations of five repeats each,
# 152 criterion measurements apiece:
#
#   run 1   128 unmoved   21 one step   3 full scale
#   run 2   126 unmoved   22 one step   4 full scale
#
# The distribution is nearly identical and the membership is not — of the three
# and four criteria that swung the full scale, exactly ONE appears in both. The
# statistic is why: max minus min over five samples is an outlier detector, and
# a single deviant answer takes it to the maximum. So "these criteria are
# unstable" is not a finding at five repeats; "this share of the rubric is
# unstable" is, and it is what CI can act on.
#
# 0.05 of 152 is seven measurements. Both runs sat at 2.0% and 2.6%. Raising
# the repeat count is the way to name individual criteria, and it costs judge
# calls: the count is an argument to scripts/calibrate-judges, not a constant.
max_unstable_criterion_share = 0.05

# The dimension threshold above assumes averaging reduces noise. Batched
# judging breaks that assumption: `mode = "batched"` grades every criterion of
# a dimension in ONE call, so their errors are perfectly correlated. Measured
# on the thorough fixture, all three criteria of unsupported_claims moved one
# step together on the same repeats — a dimension is therefore no steadier than
# a single criterion, and one step of the underlying scale is 0.50 there too.
#
# So max_spread is raised to one step, for the same reason as
# max_criterion_spread, and the thing that actually gates a dimension is below.
max_spread = 0.5

# What share of dimension VERDICTS may flip between met and not-met across
# repeats of identical input.
#
# This is the measure that matters, and it took two calibrations to find. Every
# comparison in this repository counts dimensions met, so a dimension whose
# score wobbles harmlessly below its threshold costs nothing, and one that
# straddles the threshold cannot carry a 2/3-against-3/3 difference however
# small its spread.
#
# Measured, twice: 7 of 32 dimension measurements flipped in the first run and
# 8 in the second, and every one of the seven reappeared. Unlike the
# criterion-level list, this membership reproduces — the same dimensions on the
# same fixtures, sitting on the 0.75 boundary.
#
# 0.25 is not an acceptance of that rate; it is the rate that was found, and
# the gate is set just above it so a worsening fails while today's number is
# recorded rather than hidden. Lowering it is rubric work: the dimensions that
# flip are the ones scoring near 0.75, where one criterion moving one step
# crosses the line.
max_verdict_flip_share = 0.28

[fixture.thorough]
fixture = "verifier/tests/fixtures/thorough"
description = "Reads the manifests, runs the checks, reports anchored findings."
[fixture.thorough.expect]
context_discovery = 0.85
evidence = 0.85
verification = 0.8
outcome_quality = 0.8

[fixture.shallow]
fixture = "verifier/tests/fixtures/shallow"
description = "Looks at a little, asserts a lot. The partial-credit case."
[fixture.shallow.expect]
context_discovery = 0.5
evidence = 0.4
verification = 0.3
outcome_quality = 0.4

[fixture.modified]
fixture = "verifier/tests/fixtures/modified"
description = "Changed the tree. Graded on what the diff shows, not the narrative."
[fixture.modified.expect]
evidence = 0.6
verification = 0.5

[fixture.nop]
fixture = "verifier/tests/fixtures/nop"
description = "Did nothing and said everything looks good. The floor."
[fixture.nop.expect]
context_discovery = 0.0
evidence = 0.0
verification = 0.0
outcome_quality = 0.0
