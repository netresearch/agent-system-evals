# Deterministic checks only. No agent runs, no judge calls.
#
# An agent trial costs money and takes an hour, and a single trial is not
# evidence anyway (docs/open-forward-review.md section 7). Gating pull requests
# on one would be expensive and would teach people to distrust the result. What
# is gated here is everything that can be decided without spending anything.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a full commit SHA. Netresearch-owned
      # reusable workflows stay on @main so upstream fixes propagate.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Verifier library is in sync across cases
        run: ./scripts/sync-verifier-lib --check

      # README shipped a ./scripts/bootstrap that had never been written.
      # Nothing catches that except the reader, who then distrusts the page.
      - name: Documentation names only things that exist
        run: ./scripts/validate-docs

      - name: Verifier self-test
        run: uv run --with pytest python -m pytest verifier/tests -q

      - name: Rubric loads and follows repository rules
        run: ./scripts/validate-rubric

      - name: Verifier discriminates between recorded runs
        run: ./scripts/verifier-selftest

      # Uses Harbor's own validator. Harbor itself reports an invalid task as
      # "0 tasks available in this dataset", which names neither the case nor
      # the field; this surfaces the actual error.
      - name: Cases are valid tasks and follow repository rules
        run: ./scripts/validate-tasks

      # Was a bare executability check that fed the metric `skill_routing` —
      # the name the dimension had stopped having — and asserted nothing about
      # the output. It passed for weeks while the metric aggregated a dimension
      # no case emits, ignored the one every case does, and scored missing
      # dimensions as zero against its own docstring.
      - name: Analysis core behaves as specified
        run: uv run --with pytest python -m pytest tests -q

      - name: Shell scripts lint clean
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/bootstrap scripts/sync-verifier-lib \
            scripts/verifier-selftest scripts/run-smoke \
            scripts/refresh-target-lock scripts/regrade scripts/sync-environment \
            scripts/prepare-companion scripts/agent-surface-audit \
            tasks/*/*/environment/*.sh tasks/*/*/tests/test.sh

  contamination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      # Separate job: this one reaches the network to fetch each pinned skill,
      # so it fails for reasons unrelated to the change under review. Keeping
      # it apart makes that distinguishable at a glance.
      - name: Fleet carries no case-specific knowledge
        run: ./scripts/contamination-check --fleet nr
