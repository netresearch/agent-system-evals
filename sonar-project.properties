sonar.projectKey=netresearch_agent-system-evals
sonar.organization=netresearch

# Excluded from analysis, not merely from duplicate detection.
#
# These keys are ALSO set in the SonarCloud project settings, and that is where
# they actually take effect: automatic analysis does not read exclusions from
# this file at all. Setting them here and nowhere else leaves the gate failing
# on duplication with no visible cause — the project settings read back empty
# while this file looks correct. `sonar.cpd.exclusions` was tried first and
# changed nothing (5.4% to 6.0% across the attempt, because the attempt added
# lines). Keep the two in step: change one, change the other.
#
# site/index.html is generated from site/index.template.html by
# scripts/build-site, so analysing both counts every sentence of the published
# page twice. That, not the data, is most of the duplication.
#
# experiments/ and jobs/ are recorded measurements and agent output. Every
# experiment record repeats the case, the endpoint, the model, the
# randomisation and the stopping rule once per block, by design: a record has
# to be readable on its own a year later, without the ones beside it.
# Deduplicating them would defeat what they are for.
sonar.exclusions=site/index.html,experiments/**,jobs/**,datasets/**
