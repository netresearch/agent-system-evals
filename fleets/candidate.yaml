# The stack with a proposed change, derived from `nr` rather than copied.
#
# A copy still names the parent's other versions on the day the parent moves,
# so the arm measures two changes and reports one. `at` moves exactly the refs
# named here and inherits the rest; pinning one to what the parent already
# carries is refused, because that arm equals its parent and reads as a change
# with no effect.
#
# Record the resolved commit from the job lock with the result. A branch ref is
# acceptable here and only here, a candidate being transient by definition —
# and a branch that moves between the two runs of an A/B invalidates the
# comparison, which the lock is the only thing that will show.

name: candidate
description: nr with typo3-docs at v2.19.0 — guides.xml parsed rather than named

derives_from: nr
at:
  # v2.16.0 -> v2.19.0, which is three releases and not one change. v2.17.0
  # added a literalinclude checkpoint, an objects.inv.json recipe and a
  # screenshot rule; v2.18.0 made the guides.xml skeleton reachable and was
  # measured against this very case, where it changed nothing; v2.19.0 makes
  # validate_docs.sh and checkpoint TD-05 parse guides.xml rather than look at
  # its name. Only the last of the three is untested here.
  #
  # The expectation is stated before the run rather than after it: this change
  # is a check, not a generator. It fails when guides.xml is wrong; it does not
  # write a correct one. The validator was run in one of six recorded trials,
  # and nothing in a Harbor trial executes checkpoints. So `documentation` is
  # expected NOT to move, and a run that confirms that is evidence about where
  # the lever has to sit, not about whether the check works — that was settled
  # against ten recorded files before the release.
  netresearch/typo3-docs-skill: v2.19.0
