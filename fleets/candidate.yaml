# The stack with a proposed change, derived from `nr` rather than copied.
#
# A copy still names the parent's other versions on the day the parent moves,
# so the arm measures two changes and reports one. `at` moves exactly the refs
# named here and inherits the rest; pinning one to what the parent already
# carries is refused, because that arm equals its parent and reads as a change
# with no effect.
#
# Record the resolved commit from the job lock with the result. A branch ref is
# acceptable here and only here, a candidate being transient by definition —
# and a branch that moves between the two runs of an A/B invalidates the
# comparison, which the lock is the only thing that will show.

name: candidate
description: nr with typo3-docs at v2.18.0 — the guides.xml skeleton made reachable

derives_from: nr
at:
  # v2.16.0 -> v2.18.0, which is two releases and not one change. v2.17.0 added
  # a literalinclude checkpoint, an objects.inv.json recipe and a screenshot
  # rule; none of them touches creating documentation from nothing, which is
  # what OFR-TYPO3-DOCS-001 exercises. A difference here is attributable to the
  # pair, and to v2.18.0 only by that argument.
  netresearch/typo3-docs-skill: v2.18.0
