sonar.projectKey=netresearch_agent-system-evals
sonar.organization=netresearch

# Recorded measurements, not source. Every experiment record repeats the same
# fields per block by design -- the case, the endpoint, the model, the
# randomisation, the stopping rule -- because each record has to be readable on
# its own a year later without the ones beside it. Deduplicating them would
# defeat the reason they exist, so they are excluded from copy-paste detection
# rather than contorted to satisfy it. Job artefacts are the agents' own output
# and were never ours to shape.
sonar.cpd.exclusions=experiments/**,jobs/**,datasets/**,site/index.html

# The rendered page is generated from site/index.template.html by
# scripts/build-site; analysing both counts every sentence twice.
sonar.exclusions=jobs/**
