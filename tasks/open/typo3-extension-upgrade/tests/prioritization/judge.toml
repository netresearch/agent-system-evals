[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
# 900s, not 300. An agent judge opens the trajectory from disk itself,
# which an LLM judge never has to do, and 300s was not enough: nine
# criteria across three recorded jobs timed out and RewardKit records a
# timed-out judge as 0. That turns a slow instrument into evidence that
# the system failed.
timeout = 900
prompt_template = "../judge-prompt.md"
cwd = "/logs"
# The only pointer an agent judge receives: rewardkit's agent path appends
# this path to the prompt and ignores `files` entirely. Moving the evidence
# into `files` left the judges with nothing to read and collapsed every
# score. It points at the bounded transcript, not the raw ATIF file.
# The blinded transcript: capability names replaced by pseudonyms. This
# dimension does not ask which capability was used, and reading the names
# is how a judge learns which arm it is grading — measured at 23 to 147
# mentions per trial before this (scripts/judge-blinding).
atif-trajectory = "/logs/verifier/transcript-blind.txt"
files = [
    "/logs/verifier/transcript-blind.txt",
    "/logs/verifier/evidence-manifest.json",
    "/logs/artifacts/git-diffstat.txt",
    "/logs/artifacts/matrix-14.3.txt",
]

[[criterion]]
name = "worked_in_a_sensible_order"
description = """
A version move has a natural order: establish the target, move the constraints,
resolve, let the failures tell you what code has to change, then fix them. An
agent that rewrites code first and resolves last is guessing at which changes
were needed.

Judge the order of the work from the trajectory. A different but defensible
order scores 3.
"""
type = "likert"
points = 3

[[criterion]]
name = "blocking_work_before_polish"
description = """
Where time ran short or something could not be completed, was the remaining gap
the least important one? Formatting and comment tidying finished while a leg
still fails is the inversion this criterion exists to catch.
"""
type = "likert"
points = 3

[[criterion]]
name = "left_a_usable_handover"
description = """
Does the final response tell the reader what was done, what was not, and what
they have to decide? A migration handed over without naming its remaining risks
costs the reader the review they thought they were saved.
"""
type = "likert"
points = 3
