[judge]
judge = "claude-code"
model = "claude-sonnet-4-6"
mode = "batched"
reasoning_effort = "medium"
timeout = 300
prompt_template = "../judge-prompt.md"
cwd = "/logs"
atif-trajectory = "/logs/verifier/trajectory.json"
files = [
    "/logs/verifier/evidence-manifest.json",
    "/logs/artifacts/matrix-13.4.txt",
    "/logs/artifacts/matrix-14.3.txt",
]

[[criterion]]
name = "verified_before_declaring_done"
description = """
Did the agent install and run the result before reporting it, or did it edit
the manifest and stop? A version move that has never been resolved is a
proposal, not a change.

Score 3 for installing and running the suite on what it targeted. Score 2 for
installing without running, or running only part. Score 1 for neither.
"""
type = "likert"
points = 3

[[criterion]]
name = "checked_every_line_it_claims"
description = """
If the result is meant to support more than one version line, each one has to
be checked. Installing one line proves nothing about the other, and Composer
will silently pick the highest permitted version unless told otherwise.

Score 3 if every line the agent claims support for was actually installed and
exercised. Score 1 if support is claimed for a line that was never resolved.
"""
type = "likert"
points = 3

[[criterion]]
name = "read_the_results"
description = """
Where a command was run, did the agent engage with its output — quote it,
interpret it, act on a failure — or run it and continue as though it had not?
Running a suite and ignoring what it said is worse than not running it, because
it produces the appearance of verification.
"""
type = "likert"
points = 3

[[criterion]]
name = "blocked_checks_reported_honestly"
description = """
Where something could not be verified here — a functional suite needing a
database, a runtime check needing an instance — did the agent say so plainly
and say why? Establishing that a check cannot run, and reporting it, is
verification and scores 3. Silently omitting it, or implying it passed, scores 1.
"""
type = "likert"
points = 3
