# Recorded human decisions on contamination-check hits for this case.
#
# Shape and rules: see tasks/open/typo3-extension-upgrade/tests/contamination-decisions.yaml.
# Pinned to the skill ref each was judged at; a fleet bump lapses them and the
# new text is judged fresh.
#
# Three entries, two kinds.
#
# The two typo3-testing ones are **permanent**. That line is not an attribution
# but a citation — "Observed concretely in [t3x-nr-image-optimize#93]" supports
# a factual claim about PHPUnit's strict coverage metadata producing
# green-locally-red-in-CI. Removing it would leave the claim unsupported and
# make the document worse. A benchmark that pushes a skill to drop its evidence
# has started corrupting the thing it measures. An example attribution is
# decoration and can go; a citation is evidence and stays.
#
# The php-modernization entry that stood here lapsed with v1.22.1: its
# attribution was generalised upstream and the fleet moved. The two below are
# re-pinned to v5.20.3 rather than deleted — a decision is pinned to the ref it
# was judged at, and this text is unchanged in the new version.
#
# The php-modernization one was read line by line before being recorded, because
# it is the closest to real contamination in this repository so far. It
# documents the multi-version adapter pattern for a dependency with incompatible
# major APIs — derived from this extension's intervention/image v2/v4 work. The
# fix this case asks an agent to write a changelog for is a *different* one in
# the same dependency: a decoder heuristic that misreads a non-ASCII path as
# binary image data. The document does not name it, does not describe it, and
# would not lead an agent to it.
#
# It is recorded rather than waved through because that judgement is close
# enough to be worth writing down, and because the attribution should go
# regardless.

- skill: netresearch/typo3-testing-skill
  ref: v5.20.3
  path: typo3-testing-skill-5.20.3/skills/typo3-testing/references/ci-cd.md
  marker: netresearch/t3x-nr-image-optimize
  reason: Attribution on a note about PHPUnit strict coverage metadata; names the target and nothing about its release.

- skill: netresearch/typo3-testing-skill
  ref: v5.20.3
  path: typo3-testing-skill-5.20.3/skills/typo3-testing/references/ci-cd.md
  marker: t3x-nr-image-optimize
  reason: The same attribution, matched by the shorter repository marker.

# Three more, from the skill this case's composition experiment added to the
# fleet on 28 August. All three are attributions in `github-release-skill`, and
# they are the closest thing to target knowledge in this repository, because the
# case asks for a release of the very extension two of them name.
#
# They are recorded as learnings, and the reasoning is worth stating rather than
# assuming. The immutable-releases line is a citation in the sense the two
# typo3-testing entries above establish: it supports a factual claim about
# Packagist refusing a *version* rather than a package, and the observed version
# pair is the evidence for it. It describes a retag incident that already
# happened on v2.4.0 and v1.3.0. This case asks an agent to prepare v2.4.2 — a
# different act, on a repository whose state the document does not describe. It
# would not lead an agent to what this case grades.
#
# The ter-republish line is the other kind: three repository names listed as
# "pattern used across netresearch TYPO3 extensions". That is decoration and
# should go from the skill regardless of this benchmark; filed as
# netresearch/github-release-skill#92. It is
# recorded here rather than waved through so the arm that ran on 28 August is
# judged rather than quietly accepted.
#
# What the reader of the experiment should know: the equipped arm carried a
# skill naming the target repository, and the mechanical outcome was still 0 of
# 6 — the same as the arm without it.

