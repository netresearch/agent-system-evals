# Publish the results page.
#
# The page is generated by `scripts/build-site` from the jobs named in
# `site/report.toml`, on the machine that holds them, and the rendered result is
# committed. This workflow publishes that file and nothing else — the template
# and the manifest stay in the repository.
#
# It cannot generate here: job directories are not committed, because doing so
# would publish complete agent transcripts. `scripts/build-site --lint` runs in
# the validate workflow and checks what is checkable without them: that every
# placeholder names a resolvable field, and that the committed page carries
# none.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage only what is published
        run: |
          mkdir -p _site
          cp site/index.html _site/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
