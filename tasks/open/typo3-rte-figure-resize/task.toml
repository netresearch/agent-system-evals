schema_version = "1.4"

# Must stay above the first table header: `artifacts` is a top-level key, and
# TOML assigns any key written after a table header to that table instead.
artifacts = [
    "/logs/artifacts",
    "/logs/agent",
]

[task]
name = "netresearch/ofr-typo3-rte-figure-resize"
version = "1.0.0"
description = "Open forward review: a reported CKEditor 5 resize width lost in frontend rendering"
authors = [{ name = "Netresearch DTT GmbH" }]
keywords = ["open-forward-review", "typo3", "bug", "rendering", "agent-system"]

[metadata]
case_id = "OFR-TYPO3-RESIZE-001"
category = "open-forward-review"

# The first case mined from the world rather than written for the benchmark.
# The request is a user's bug report, quoted; the expected behaviour is the one
# the maintainers' own fix established; and neither was chosen with a benchmark
# in mind. What that buys is a ground truth nobody here selected — and it costs
# the ability to tune the case, which is the point.
#
# Both halves were verified before the case was built, same file, same command,
# same environment:
#   31ea0898 (pinned here)  13 tests, 4 failures
#   4796899  (the real fix) 13 tests, 0 failures
source_learning_id = "retro-20260829-mine-cases-from-reported-defects"
source_issue = "https://github.com/netresearch/t3x-rte_ckeditor_image/issues/863"
source_fix = "https://github.com/netresearch/t3x-rte_ckeditor_image/pull/865"

required_artifacts = [
    "git-status.txt",
    "git-diff.patch",
    "figure-resize-check.txt",
    "own-checks.txt",
    "git-log.txt",
]

domain = "typo3"
target_type = "extension"
target_repository = "https://github.com/netresearch/t3x-rte_ckeditor_image.git"
target_package = "netresearch/rte-ckeditor-image"
target_sha = "31ea08989b3daf9f44dae17e95ac92646633d5b5"

# No HTTP instance, unlike the other open cases. The reported behaviour is a
# pure rendering path and is reachable through the extension's own functional
# stack on SQLite; the reasoning and what it costs are in environment/Dockerfile
# and in the README.
runtime = false

# One dimension, not eight. The answer here is decided mechanically; the judge
# is asked only about what a pass/fail cannot see.
dimensions = ["outcome_quality"]

# Ground truth, decided by the framework rather than by a judge: the
# maintainers' own functional test, staged after the agent has finished.
[metadata.mechanical_outcome]
artifacts = "figure-resize-check.txt"
all_of = ["figure resize: ok"]

[agent]
# The task needs no network. The agent still needs its own model endpoint.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
# Harbor removes every value in this table from all captured output.
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "pypi.org", "files.pythonhosted.org"]

[[verifier.collect]]
command = "git -C /app status --porcelain > /logs/artifacts/git-status.txt 2>&1 || true"

# The diff against the PINNED COMMIT, not against HEAD.
#
# `git diff HEAD` records nothing once an agent commits its work, and agents
# commit: the first trial of this case made ten edits and nine commits, and
# left a zero-byte patch for the judge to read "is the change narrow" from.
# Across the recorded jobs that shape covers most trials of most cases, and it
# renders "changed nothing" and "changed a great deal, then committed"
# identically — opposite outcomes (docs/instrument-failures.md 27).
#
# environment/build-target.sh asserts the history is exactly one commit, so
# the root commit is the pinned one and everything after it is the agent's.
#
# `git diff <base>` without `HEAD`, deliberately: with `HEAD` it shows
# committed work only, and the first series on this case had an arm leave six
# files modified and unstaged, which produced an empty patch for the second
# time. Without `HEAD` the comparison is base against the WORKING TREE and
# covers both. `git status --porcelain` is still appended, because neither form
# shows a file that was never added.
[[verifier.collect]]
command = '''
{
  base=$(git -C /app rev-list --max-parents=0 HEAD)
  git -C /app diff --no-renames "$base"
  git -C /app status --porcelain
} > /logs/artifacts/git-diff.patch 2>&1 || true
'''

# What the agent committed, in its own words. For an agent that commits, the
# message is the only place it states what it believes it changed.
[[verifier.collect]]
command = "git -C /app log --oneline > /logs/artifacts/git-log.txt 2>&1 || true"

# The extension's own unit suite, in a scratch copy (ADR 0007). It was green at
# the pinned commit — proved at image build time — so a red suite here is
# something the agent did, and separates "fixed it" from "made it green".
[[verifier.collect]]
command = '''
{
  rm -rf /tmp/nreval-own && cp -a /app /tmp/nreval-own && cd /tmp/nreval-own \
  && typo3DatabaseDriver=pdo_sqlite .Build/bin/phpunit -c Build/phpunit/UnitTests.xml --no-coverage \
  && echo "own checks: ok" || echo "own checks: failed"
} > /logs/artifacts/own-checks.txt 2>&1 || true
'''
timeout_sec = 900.0

# The behavioural check: the functional test the maintainers wrote for this
# report, written into a scratch copy of the agent's tree and run there.
#
# Embedded here rather than copied from a file, because a collector runs in the
# environment container and the task's tests/ directory is only mounted in the
# verifier image — the first version copied from /tests and produced
# `cp: cannot stat '/tests/...'`, which reads as a missing file and was a
# missing mount. Embedding also settles the contamination question by
# construction: the assertions exist in no image the agent can reach, which
# environment/build-target.sh asserts for the tree as well.
#
# tests/FigureResizeWidthRenderingTest.php holds the same source and is what a
# reader should read; tests/test_case_check_matches_its_source.py fails if the
# two drift apart.
#
# It drives ImageRenderingAdapter::renderFigure(), a public method that existed
# before the fix, with stored HTML and asserts the rendered HTML. Nothing in it
# names the fix's internals, so a correct fix reached another way passes. That
# property was the reason this candidate was adopted and four others were not.
[[verifier.collect]]
command = '''
{
  rm -rf /tmp/nreval-check && cp -a /app /tmp/nreval-check \
  && mkdir -p /tmp/nreval-check/Tests/Functional/Controller \
  && mkdir -p /tmp/nreval-check/typo3temp/var/tests/functional-sqlite-dbs \
  && cat > /tmp/nreval-check/Tests/Functional/Controller/FigureResizeWidthRenderingTest.php <<'NREVAL_FIGURE_TEST'
<?php

/*
 * Copyright (c) 2025-2026 Netresearch DTT GmbH
 * SPDX-License-Identifier: AGPL-3.0-or-later
 */

declare(strict_types=1);

namespace Netresearch\RteCKEditorImage\Tests\Functional\Controller;

use Netresearch\RteCKEditorImage\Controller\ImageRenderingAdapter;
use PHPUnit\Framework\Attributes\DataProvider;
use PHPUnit\Framework\Attributes\Test;
use Psr\Http\Message\ServerRequestInterface;
use TYPO3\CMS\Core\Http\ServerRequest;
use TYPO3\CMS\Core\Site\Entity\Site;
use TYPO3\CMS\Frontend\ContentObject\ContentObjectRenderer;
use TYPO3\TestingFramework\Core\Functional\FunctionalTestCase;

/**
 * Functional tests for CKEditor 5 image resize rendering.
 *
 * CKEditor 5's resize handles store the chosen size as a `width` declaration on
 * the <figure> element (class `image_resized`) and leave the <img> at its
 * intrinsic pixel size. Before the fix for issue #863 the frontend replaced that
 * declaration with the computed `max-width`, so every resized image rendered at
 * full width.
 *
 * @author  Netresearch DTT GmbH
 * @license https://www.gnu.org/licenses/agpl-3.0.de.html
 *
 * @see https://github.com/netresearch/t3x-rte_ckeditor_image/issues/863
 */
final class FigureResizeWidthRenderingTest extends FunctionalTestCase
{
    protected array $testExtensionsToLoad = [
        'typo3conf/ext/rte_ckeditor_image',
    ];

    protected array $coreExtensionsToLoad = [
        'typo3/cms-rte-ckeditor',
    ];

    private ServerRequestInterface $request;

    protected function setUp(): void
    {
        parent::setUp();

        $this->importCSVDataSet(__DIR__ . '/Fixtures/pages.csv');
        $this->importCSVDataSet(__DIR__ . '/Fixtures/sys_file_storage.csv');
        $this->importCSVDataSet(__DIR__ . '/Fixtures/sys_file.csv');

        $site = new Site('test', 1, [
            'base'      => 'http://localhost/',
            'languages' => [
                [
                    'languageId' => 0,
                    'title'      => 'English',
                    'locale'     => 'en_US.UTF-8',
                    'base'       => '/',
                ],
            ],
        ]);

        $this->request = (new ServerRequest())
            ->withAttribute('site', $site)
            ->withAttribute('language', $site->getDefaultLanguage());
    }

    /**
     * Render a stored RTE figure through the TypoScript entry point.
     */
    private function renderFigure(string $inputHtml): string
    {
        $adapter = $this->get(ImageRenderingAdapter::class);

        /** @var ContentObjectRenderer $contentObjectRenderer */
        $contentObjectRenderer = $this->get(ContentObjectRenderer::class);

        $contentObjectRenderer->setCurrentVal($inputHtml);
        $adapter->setContentObjectRenderer($contentObjectRenderer);

        /** @var string $result */
        $result = $adapter->renderFigure(null, [], $this->request);

        return $result;
    }

    /**
     * The reported case: a resized image with a caption.
     */
    #[Test]
    public function percentageResizeWithCaptionKeepsWidthOnFigure(): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="width:26.43%;">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        // Asserted in full: the figure carries the author width while the <img>
        // is stretched to fill it. Without the `width:100%` on the image the
        // narrowed figure would simply be overflowed by the 1334px image, and a
        // substring assertion on the figure alone would not notice.
        self::assertSame(
            '<figure class="image image_resized" style="width:26.43%;max-width: 1334px">'
            . '<img src="fileadmin/test-image.jpg" alt="Test" width="1334" height="1000" decoding="async" style="width:100%;height:auto" />'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
            $result,
        );
    }

    /**
     * The computed max-width from #667 keeps captions from overflowing the image
     * and must survive alongside the restored author width.
     */
    #[Test]
    public function percentageResizeWithCaptionKeepsComputedMaxWidth(): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="width:26.43%;">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        self::assertStringContainsString('max-width', $result, 'Result: ' . $result);
    }

    #[Test]
    public function percentageResizeWithCaptionKeepsResizedClass(): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="width:26.43%;">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        self::assertStringContainsString('image_resized', $result, 'Result: ' . $result);
    }

    /**
     * Without a caption no <figure> wrapper is emitted (see #595), so the width
     * has to travel on the <img> instead.
     */
    #[Test]
    public function percentageResizeWithoutCaptionKeepsWidthOnImage(): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="width:26.43%;">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '</figure>',
        );

        // `height:auto` is required: the height attribute would otherwise pin the
        // image to its intrinsic 1000px and distort it once the width is relative.
        self::assertSame(
            '<img src="fileadmin/test-image.jpg" alt="Test" width="1334" height="1000" decoding="async"'
            . ' class="image image_resized" style="width:26.43%;height:auto" />',
            $result,
        );
    }

    #[Test]
    public function pixelResizeWithCaptionKeepsWidthOnFigure(): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="width:320px;">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        self::assertStringContainsString('width:320px', $result, 'Result: ' . $result);
    }

    /**
     * Resizing a linked image must keep both the width and the link.
     */
    #[Test]
    public function percentageResizeOnLinkedImageKeepsWidthAndLink(): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="width:33%;">'
            . '<a href="https://example.com/target">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '</a>'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        self::assertStringContainsString('width:33%', $result, 'Result: ' . $result);
        self::assertStringContainsString('https://example.com/target', $result, 'Result: ' . $result);
    }

    /**
     * An image that was never resized must render exactly as before.
     */
    #[Test]
    public function unresizedImageWithCaptionGetsNoWidthDeclaration(): void
    {
        $result = $this->renderFigure(
            '<figure class="image">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        self::assertStringNotContainsString('width:26.43%', $result, 'Result: ' . $result);
        self::assertStringContainsString('max-width', $result, 'Result: ' . $result);
    }

    /**
     * Declarations the author could smuggle into the stored style attribute.
     *
     * @return array<string, array{0: string, 1: string}>
     */
    public static function unsafeFigureStyleProvider(): array
    {
        return [
            'url in sibling declaration' => ['width:26%;background:url(//evil.example/x);', 'evil.example'],
            'behavior property'          => ['width:26%;behavior:url(//evil.example/x.htc);', 'evil.example'],
            'legacy IE expression'       => ['width:expression(alert(1));', 'expression'],
            'url as width value'         => ['width:url(//evil.example/x);', 'evil.example'],
            'position fixed overlay'     => ['width:26%;position:fixed;top:0;left:0;', 'position'],
        ];
    }

    #[Test]
    #[DataProvider('unsafeFigureStyleProvider')]
    public function unsafeDeclarationsNeverReachTheOutput(string $style, string $forbidden): void
    {
        $result = $this->renderFigure(
            '<figure class="image image_resized" style="' . $style . '">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>',
        );

        self::assertStringNotContainsString($forbidden, $result, 'Result: ' . $result);
    }

    /**
     * Re-rendering the frontend output must not accumulate or drop the width.
     */
    #[Test]
    public function renderingResizedFigureIsIdempotent(): void
    {
        $input = '<figure class="image image_resized" style="width:26.43%;">'
            . '<img src="/fileadmin/test-image.jpg" width="1334" height="1000" data-htmlarea-file-uid="1" alt="Test">'
            . '<figcaption>Caption</figcaption>'
            . '</figure>';

        $first  = $this->renderFigure($input);
        $second = $this->renderFigure($first);

        self::assertSame(
            substr_count($first, 'width:26.43%'),
            substr_count($second, 'width:26.43%'),
            'First: ' . $first . ' Second: ' . $second,
        );
    }
}
NREVAL_FIGURE_TEST
  cd /tmp/nreval-check \
  && typo3DatabaseDriver=pdo_sqlite .Build/bin/phpunit \
       -c Build/phpunit/FunctionalTests.xml --no-coverage \
       Tests/Functional/Controller/FigureResizeWidthRenderingTest.php \
  && echo "figure resize: ok" || echo "figure resize: incomplete"
} > /logs/artifacts/figure-resize-check.txt 2>&1 || true
'''
timeout_sec = 1200.0
