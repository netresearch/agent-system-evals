
# Three from `git-workflow`, added to a fleet on 28 August to test whether this
# case's zero invocations are composition (docs/composition-sweep.md).
#
# All three are the same citation, repeated in the reference, the script and the
# script's test: `netresearch/maint` #52 and #53 are the evidence that Copilot's
# review quota is account-wide and monthly rather than per pull request, which
# is why `pr-status.sh` writes a month-stamped marker file.
#
# It names this case's target repository and it is about a GitHub quota, which
# is close enough to be worth reading rather than waving through. It is a
# different mechanism from the one this case grades: the review quota rejecting
# a `requested_reviewers` POST, not the primary API rate limit; a pull request,
# not a scheduled workflow. Exit statuses are not mentioned anywhere in it, and
# the case turns entirely on whether exiting non-zero is the right answer when
# the next scheduled run would succeed.

