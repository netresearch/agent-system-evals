# Which recorded jobs the published page is built from.
#
# Every figure on the page is resolved from these directories by
# `scripts/build-site`. Nothing on the page may be typed by hand: a placeholder
# that does not resolve fails the build, and a job named here that is not on
# disk fails it too.
#
# Before this file the page was written by hand and published as-is. Nothing
# bound a number to the trial that produced it, and one figure that had to be
# withdrawn had been sitting there with no way to trace where it came from.
#
# Job directories are not committed (`jobs/` is ignored), so a build needs the
# machine that produced them. That is the honest state: the page is
# reproducible where the evidence is, and the alternative — committing every
# artifact — publishes agent transcripts wholesale.

